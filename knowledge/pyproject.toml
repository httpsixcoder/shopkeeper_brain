[project]
name = "agentrepository"
version = "0.1.0"
description = "The intelligent dialog window allows users to search for content by entering document information."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "flagembedding>=1.3.5",
    "grandalf>=0.8",
    "langchain>=1.2.13",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.11",
    "langgraph>=1.1.3",
    "loguru>=0.7.3",
    "magic-pdf>=1.3.12",
    "mineru-kie-sdk>=0.1.1",
    "minio>=7.2.20",
    "modelscope>=1.35.1",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pymilvus[model]>=2.6.10",
    "pymilvus-model>=0.3.2",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "regex>=2026.2.28",
    # ==============旧版：如下==============
    # "torch>=2.10.0",
    # "torchaudio>=2.10.0",
    # "torchvision>=0.25.0",
    # 建议直接删掉版本约束，或者改成 >=2.4.1
    # ==============更新：如下==============
    "torch>=2.4.1",
    "torchaudio>=2.4.1",
    "torchvision>=0.19.1",
    # ==============更新：结束==============
    "uvicorn>=0.42.0",
    "transformers>=4.57.6",
    "datasets>=4.8.4",
    "openai-agents>=0.4.2",
    "requests>=2.32.5",
]
# 项目下配置环境变量(更推荐)
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# ==============更新：如下==============
# CUDA pytorch
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
#告诉 uv 只在安装 torch 相关包时才去 PyTorch 索引查找，其他包（如 requests）则从清华源解析，从而避免冲突。
explicit = true  # 添加这一行

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
# ==============更新：结束==============