# ================================================================
# GPU 环境配置（NVIDIA CUDA 12.6）—— 适配 GTX 1660 Ti Max-Q / 6GB
# 用法：备份原 pyproject.toml 后，用本文件覆盖，然后 uv sync
# 说明：torch 三件套从 PyTorch 官方 cu126 索引取轮子，其余走清华源
# ================================================================

[project]
name = "agentrepository"
version = "0.1.0"
description = "The intelligent dialog window allows users to search for content by entering document information."
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.135.1",
    "flagembedding>=1.3.5",
    "grandalf>=0.8",
    "langchain>=1.2.13",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.11",
    "langgraph>=1.1.3",
    "loguru>=0.7.3",

    # MinerU：只装 pipeline 引擎。
    # 不要写 mineru[all]：Windows 上 [all] 会连带 lmdeploy、gradio、vlm，
    # lmdeploy 需要 nvcc/CUDA Toolkit，6G 显存也跑不动它带的 VLM。
    "mineru[pipeline]>=3.4.2,<4.0",

    # MinerU 漏声明的运行时依赖：它的 OCR 子模块（pytorchocr/data/imaug/operators.py）
    # 里有一句裸的 `import six`，但 mineru 的 METADATA 里没有 Requires-Dist: six。
    # 不显式装上，-b pipeline 解析时会直接 ModuleNotFoundError: No module named 'six'
    "six>=1.16",

    "minio>=7.2.20",
    "modelscope>=1.35.1",

    # 数值栈：保留上界，避免被解析到未验证的破坏性大版本
    "numpy>=2.2,<2.6",
    "opencv-python>=4.11,<5",   # 不加 <5 会被解析成 opencv 5.x，MinerU 的图像处理接口会报错
    "pandas>=2.2,<4",

    "pymilvus[model]>=2.6.10,<4",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "regex>=2026.2.28",
    "uvicorn>=0.42.0",

    # MinerU 3.x 的硬约束：transformers>=4.57.3 且 <5.0
    "transformers>=4.57.6,<5.0",
    "datasets>=4.8.4",
    "openai-agents>=0.4.2",
    "requests>=2.32.5",

    # PyTorch 三件套：必须同批次精确锁定
    # 版本号不要写 +cu126，本地 CUDA 标签由 tool.uv.sources 指向的索引决定
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchaudio==2.7.1",
]

# ---------------- 包索引 ----------------

# 默认源：清华镜像
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# CUDA 12.6 轮子源：只给 torch 三件套用（explicit = true）
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
